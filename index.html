<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071018">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">∑</span><span>SCIENTIFIC CALCULATOR</span></div>
      <div class="status"><span class="status-dot"></span>READY</div>
    </header>

    <section class="hero-copy">
      <p class="kicker">NUMERICAL TOOLS <span>•</span> LOCAL</p>
      <h1>Calculate with<br><em>clarity.</em></h1>
    </section>

    <section class="workspace" aria-label="Scientific calculator">
      <div class="calculator-panel">
        <div class="panel-head"><span>PRIMARY CONSOLE</span><span id="angle-label">ANGLE: DEG</span></div>
        <div class="display" aria-live="polite">
          <div class="display-meta"><span id="expression">READY FOR INPUT</span><span id="memory-indicator">M: --</span></div>
          <div class="display-value" id="display">0</div>
        </div>
        <div class="mode-row">
          <div class="segmented" role="group" aria-label="Angle mode">
            <button class="mode active" data-mode="DEG">DEG</button>
            <button class="mode" data-mode="RAD">RAD</button>
          </div>
          <button class="text-button" id="clear-history">CLEAR LOG</button>
        </div>
        <div class="keypad" id="keypad">
          <button class="key function" data-action="constant" data-value="Math.PI">π</button>
          <button class="key function" data-action="constant" data-value="Math.E">e</button>
          <button class="key function" data-action="memory-clear" title="Clear memory">MC</button>
          <button class="key function" data-action="memory-recall" title="Recall memory">MR</button>
          <button class="key function" data-action="memory-add" title="Add display to memory">M+</button>

          <button class="key function" data-action="function" data-value="sin">sin</button>
          <button class="key function" data-action="function" data-value="cos">cos</button>
          <button class="key function" data-action="function" data-value="tan">tan</button>
          <button class="key function" data-action="function" data-value="log">log</button>
          <button class="key function" data-action="function" data-value="ln">ln</button>

          <button class="key function" data-action="function" data-value="sqrt" title="Square root">√</button>
          <button class="key function" data-action="square" title="Square">x²</button>
          <button class="key operator" data-value="^" title="Power">xʸ</button>
          <button class="key operator" data-value="/">÷</button>
          <button class="key utility" data-action="backspace" aria-label="Backspace">⌫</button>

          <button class="key number" data-value="7">7</button>
          <button class="key number" data-value="8">8</button>
          <button class="key number" data-value="9">9</button>
          <button class="key operator" data-value="*">×</button>
          <button class="key utility" data-action="clear">AC</button>

          <button class="key number" data-value="4">4</button>
          <button class="key number" data-value="5">5</button>
          <button class="key number" data-value="6">6</button>
          <button class="key operator" data-value="-">−</button>
          <button class="key function" data-action="toggle-sign">+/−</button>

          <button class="key number" data-value="1">1</button>
          <button class="key number" data-value="2">2</button>
          <button class="key number" data-value="3">3</button>
          <button class="key operator" data-value="+">+</button>
          <button class="key equals" data-action="equals">=</button>

          <button class="key number zero" data-value="0">0</button>
          <button class="key number" data-action="decimal">.</button>
        </div>
      </div>

      <aside class="side-panel">
        <div class="panel-head"><span>ACTIVITY LOG</span><span id="entry-count">00</span></div>
        <div class="history-list" id="history-list"><div class="empty-state">No calculations recorded.<br>Awaiting your first query.</div></div>
        <div class="side-footer"><span>PRECISION</span><strong>10 DECIMAL PLACES</strong></div>
      </aside>
    </section>

    <footer class="footer"><span>SCIENTIFIC CALCULATOR</span><span>KEYBOARD INPUT <b>↵</b></span><span>2026</span></footer>
  </main>
</body>
</html>
